<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Design, Learned</title>
  <meta name="description" content="An interactive, browsable path through system design — from first principles to real architectures." />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>

  <div class="layout">
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <a href="#/" class="brand">System Design</a>
        <button type="button" id="search-trigger" class="search-trigger" aria-haspopup="dialog">
          <span class="search-trigger-icon" aria-hidden="true">🔎</span>
          <span class="search-trigger-label">Search</span>
          <span class="search-trigger-kbd" id="search-trigger-kbd" aria-hidden="true">Ctrl K</span>
        </button>
        <label class="tracking-toggle">
          <input type="checkbox" id="tracking-toggle-input" />
          <span class="tracking-toggle-track" aria-hidden="true"></span>
          <span>Track progress</span>
        </label>
        <div class="progress-summary" id="progress-summary"></div>
      </div>
      <div id="nav-tree" class="nav-tree" aria-label="Course navigation"></div>
    </nav>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <main id="content" class="content" tabindex="-1">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <div id="search-overlay" class="search-overlay is-hidden">
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search course content">
      <div class="search-input-row">
        <span class="search-input-icon" aria-hidden="true">🔎</span>
        <input type="text" id="search-input" class="search-input" placeholder="Search topics, terms, concepts…" autocomplete="off" spellcheck="false" />
        <button type="button" id="search-close" class="search-close" aria-label="Close search">Esc</button>
      </div>
      <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>
    </div>
  </div>

  <script src="assets/js/vendor/marked.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
